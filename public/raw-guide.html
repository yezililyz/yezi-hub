<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Guide...</title>
  <style>
    body {
      background: #fbeee0;
      color: #1c1814;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .loader {
      font-family: monospace;
      font-size: 14px;
      color: #8a7d70;
    }
  </style>
</head>
<body>
  <div class="loader" id="status">Loading guide content...</div>

  <script type="text/javascript">
    const GLOSSARY = [
      'Continuous Discovery',
      'continuous discovery',
      'Opportunity Solution Tree',
      'opportunity solution tree',
      'Opportunity Solution Trees',
      'opportunity solution trees',
      'Product Manager',
      'Product Managers',
      'product manager',
      'product managers',
      'Product Management',
      'product management',
      'Clay',
      'clay',
      'Output',
      'Outputs',
      'output',
      'outputs',
      'Outcome',
      'Outcomes',
      'outcome',
      'outcomes',
      'Playbook',
      'Playbooks',
      'playbook',
      'playbooks'
    ];

    // Canonical PM-jargon definitions shown to French readers who tap a
    // term. Keyed by the lowercase surface form(s) that appear in GLOSSARY
    // above; several surface forms (singular/plural) share one canonical
    // definition. Terms with no entry here (e.g. "Clay", a tool name) stay
    // notranslate-protected only — no tap-to-reveal, since we have no
    // reliable generic definition for a proper noun.
    var GLOSSARY_DEFS = {
      'product manager': "Le ou la Product Manager (chef·fe de produit) définit la stratégie produit, priorise ce qui est construit et coordonne design, ingénierie et business pour répondre aux besoins des utilisateurs.",
      'product managers': "Le ou la Product Manager (chef·fe de produit) définit la stratégie produit, priorise ce qui est construit et coordonne design, ingénierie et business pour répondre aux besoins des utilisateurs.",
      'product management': "Le Product Management est la discipline qui consiste à décider quoi construire et pourquoi, en s'appuyant sur la recherche utilisateur, les données et les objectifs business.",
      'continuous discovery': "La Continuous Discovery consiste à parler régulièrement aux utilisateurs (idéalement chaque semaine) pour tester des idées, plutôt que de faire de la recherche seulement de temps en temps.",
      'opportunity solution tree': "Un Opportunity Solution Tree est un schéma qui relie un objectif business aux opportunités (besoins ou problèmes des utilisateurs), puis aux solutions à tester — popularisé par Teresa Torres.",
      'opportunity solution trees': "Un Opportunity Solution Tree est un schéma qui relie un objectif business aux opportunités (besoins ou problèmes des utilisateurs), puis aux solutions à tester — popularisé par Teresa Torres.",
      'output': "Un Output est ce que l'équipe livre concrètement (une fonctionnalité, un correctif) — à distinguer de l'Outcome, l'impact réel que cela produit.",
      'outputs': "Un Output est ce que l'équipe livre concrètement (une fonctionnalité, un correctif) — à distinguer de l'Outcome, l'impact réel que cela produit.",
      'outcome': "Un Outcome est le changement de comportement ou de résultat mesurable chez l'utilisateur ou pour le business — à distinguer de l'Output, qui est juste ce qui a été livré.",
      'outcomes': "Un Outcome est le changement de comportement ou de résultat mesurable chez l'utilisateur ou pour le business — à distinguer de l'Output, qui est juste ce qui a été livré.",
      'playbook': "Un Playbook est un guide pratique et reproductible : une suite d'étapes ou de tactiques éprouvées à suivre pour atteindre un objectif donné.",
      'playbooks': "Un Playbook est un guide pratique et reproductible : une suite d'étapes ou de tactiques éprouvées à suivre pour atteindre un objectif donné."
    };

    function protectGlossaryNodes(docObj) {
      const walk = docObj.createTreeWalker(
        docObj.body,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function(node) {
            const parent = node.parentElement;
            if (!parent) return NodeFilter.FILTER_REJECT;
            const tag = parent.tagName.toUpperCase();
            if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT' || tag === 'CODE') {
              return NodeFilter.FILTER_REJECT;
            }
            if (parent.classList.contains('notranslate') || parent.getAttribute('translate') === 'no') {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      const textNodes = [];
      let node;
      while (node = walk.nextNode()) {
        textNodes.push(node);
      }

      const sortedGlossary = [...GLOSSARY].sort((a, b) => b.length - a.length);

      for (let idx = 0; idx < textNodes.length; idx++) {
        const n = textNodes[idx];
        const text = n.nodeValue || "";
        let foundTerm = null;
        let foundIndex = -1;

        for (const term of sortedGlossary) {
          const escaped = term.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
          const regex = new RegExp('\\b' + escaped + '\\b');
          const match = text.match(regex);
          if (match && match.index !== undefined) {
            foundTerm = term;
            foundIndex = match.index;
            break;
          }
        }

        if (foundTerm) {
          const parent = n.parentNode;
          if (!parent) continue;

          const beforeText = text.substring(0, foundIndex);
          const afterText = text.substring(foundIndex + foundTerm.length);

          const beforeNode = docObj.createTextNode(beforeText);
          const spanNode = docObj.createElement('span');
          spanNode.className = 'notranslate';
          spanNode.setAttribute('translate', 'no');
          spanNode.textContent = foundTerm;
          const definition = GLOSSARY_DEFS[foundTerm.toLowerCase()];
          if (definition) {
            spanNode.className += ' glossary-term';
            spanNode.setAttribute('data-def', definition);
            spanNode.setAttribute('tabindex', '0');
            spanNode.setAttribute('role', 'button');
          }
          const afterNode = docObj.createTextNode(afterText);

          parent.insertBefore(beforeNode, n);
          parent.insertBefore(spanNode, n);
          parent.insertBefore(afterNode, n);
          parent.removeChild(n);

          // Push the remaining text node to be checked as well
          textNodes.push(afterNode);
        }
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const lang = urlParams.get('lang') || 'en';
    const statusEl = document.getElementById('status');

    // Prevent double-render if both REST API and postMessage provide HTML
    var htmlRendered = false;
    // A RELATED_GUIDES message may arrive before renderHtml() has run its
    // document.write() — appending to document.body before that point would
    // be wiped out, since document.write() discards the whole document.
    // Queue it and flush once the real content is written.
    var pendingRelatedGuides = null;

    // Shared render function — called from either the REST API path (public
    // guides) or the INJECT_HTML postMessage path (private/admin-only guides
    // whose unauthenticated REST fetch is denied by Firestore rules).
    function renderHtml(html, htmlLang) {
      if (htmlRendered || !html) return;
      htmlRendered = true;

      var parser = new DOMParser();
      var docObj = parser.parseFromString(html, 'text/html');

      if (htmlLang === 'fr') {
        protectGlossaryNodes(docObj);
      }

      // Tell the browser's own translate feature (Chrome "select to translate",
      // full-page translate bar, etc.) to leave this document alone entirely —
      // this app's translation is the OpenAI pipeline (see AdminHub.tsx), never
      // Google Translate, in any form, per explicit product requirement.
      var htmlEl = docObj.documentElement;
      htmlEl.setAttribute('translate', 'no');
      var notranslateMeta = docObj.createElement('meta');
      notranslateMeta.setAttribute('name', 'google');
      notranslateMeta.setAttribute('content', 'notranslate');
      var headForMeta = docObj.querySelector('head') || htmlEl;
      headForMeta.insertBefore(notranslateMeta, headForMeta.firstChild);

      // Override window.print so Save & Export always routes through the parent's
      // auth gate regardless of which button element calls it.
      var scriptEl = docObj.createElement('script');
      scriptEl.type = 'text/javascript';
      scriptEl.textContent = '(function(){var n=window.print.bind(window);window.print=function(){window.parent.postMessage({type:"EXPORT_PDF"},"*")};window.addEventListener("message",function(e){if(!e.data)return;if(e.data.type==="DO_NATIVE_PRINT")n();if(e.data.type==="SCROLL_TO_SECTION"&&e.data.id){var el=document.getElementById(e.data.id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}})})();';
      var head = docObj.querySelector('head') || docObj.documentElement;
      head.insertBefore(scriptEl, head.firstChild);

      // Tap-to-reveal glossary popover: works for both touch and mouse via
      // plain "click" (no hover-only interaction, so it also works on
      // mobile). Only .glossary-term spans (added by protectGlossaryNodes
      // above, French only) ever trigger it — harmless no-op otherwise.
      var glossaryStyleEl = docObj.createElement('style');
      glossaryStyleEl.textContent = '.glossary-term{border-bottom:1.5px dotted #b0603d;cursor:pointer;}' +
        '.glossary-popover{position:absolute;z-index:9999;max-width:280px;background:#1c1814;color:#fbeee0;' +
        'font-size:13px;line-height:1.45;padding:10px 12px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);' +
        'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}';
      head.insertBefore(glossaryStyleEl, head.firstChild);

      var glossaryScriptEl = docObj.createElement('script');
      glossaryScriptEl.type = 'text/javascript';
      glossaryScriptEl.textContent = '(function(){var openPopover=null;function closePopover(){if(openPopover){openPopover.remove();openPopover=null;}}' +
        'document.addEventListener("click",function(e){var term=e.target&&e.target.closest?e.target.closest(".glossary-term"):null;' +
        'if(term){e.stopPropagation();if(openPopover&&openPopover._forTerm===term){closePopover();return;}closePopover();' +
        'var def=term.getAttribute("data-def");if(!def)return;var pop=document.createElement("div");pop.className="glossary-popover";' +
        'pop.textContent=def;document.body.appendChild(pop);var rect=term.getBoundingClientRect();' +
        'var top=rect.bottom+window.scrollY+6;var left=rect.left+window.scrollX;' +
        'var maxLeft=window.scrollX+document.documentElement.clientWidth-296;if(left>maxLeft)left=Math.max(8,maxLeft);' +
        'pop.style.top=top+"px";pop.style.left=left+"px";pop._forTerm=term;openPopover=pop;}else{closePopover();}});' +
        'document.addEventListener("scroll",closePopover,true);' +
        'document.addEventListener("keydown",function(e){var term=e.target&&e.target.classList&&e.target.classList.contains("glossary-term");' +
        'if(term&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});})();';
      head.insertBefore(glossaryScriptEl, head.firstChild);

      document.open();
      document.write('<!DOCTYPE html>\n' + docObj.documentElement.outerHTML);
      document.close();

      if (pendingRelatedGuides) {
        var pending = pendingRelatedGuides;
        pendingRelatedGuides = null;
        renderRelatedGuides(pending.items, pending.lang);
      }
    }

    // Appends a "Related Guides" block at the end of the rendered document.
    // Sent separately from INJECT_HTML/the REST render path — it depends on
    // GuideViewer's own topic-overlap query, which resolves independently of
    // (and often after) however this document's own HTML got rendered.
    function renderRelatedGuides(items, itemsLang) {
      if (!items || !items.length) return;
      if (!htmlRendered) { pendingRelatedGuides = { items: items, lang: itemsLang }; return; }
      if (document.getElementById('related-guides-block')) return;
      var wrap = document.createElement('div');
      wrap.id = 'related-guides-block';
      wrap.style.cssText = 'max-width:900px;margin:8px auto 60px;padding:28px 24px 0;border-top:2px solid #e5d8c6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;';
      var heading = document.createElement('div');
      heading.textContent = itemsLang === 'fr' ? 'À lire aussi' : 'Related Guides';
      heading.style.cssText = 'font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8a7d70;margin-bottom:14px;';
      wrap.appendChild(heading);
      var grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;';
      items.forEach(function(it) {
        var a = document.createElement('a');
        a.href = it.url;
        a.target = '_top';
        a.textContent = it.title;
        a.style.cssText = 'display:block;border:2px solid #1c1814;border-radius:12px;padding:14px 16px;background:#fff;text-decoration:none;color:#1c1814;font-weight:600;font-size:14px;box-shadow:3px 3px 0 #1c1814;';
        grid.appendChild(a);
      });
      wrap.appendChild(grid);
      document.body.appendChild(wrap);
    }

    // Listen for INJECT_HTML from the parent GuideViewer (sent after its own
    // authenticated Firestore read). This is the only path that works for private
    // guides whose REST API fetch below is rejected with 403 by Firestore rules.
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'INJECT_HTML') {
        renderHtml(e.data.html, e.data.lang || lang);
      }
      if (e.data && e.data.type === 'RELATED_GUIDES') {
        renderRelatedGuides(e.data.items, e.data.lang || lang);
      }
    });

    if (!id) {
      statusEl.textContent = 'Error: Guide ID is missing.';
    } else {
      var url = 'https://firestore.googleapis.com/v1/projects/yezi-hub/databases/(default)/documents/guides/' + id;
      fetch(url)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(data) {
          var fields = data.fields;
          var htmlContent   = (fields.htmlContent   && fields.htmlContent.stringValue)   || '';
          var htmlContentFr = (fields.htmlContent_fr && fields.htmlContent_fr.stringValue) || '';
          // Large guides store their HTML in Storage instead of inline —
          // htmlContent/_fr is then empty and this URL must be fetched.
          var htmlUrl   = (fields.htmlUrl   && fields.htmlUrl.stringValue)   || '';
          var htmlUrlFr = (fields.htmlUrl_fr && fields.htmlUrl_fr.stringValue) || '';

          function resolveContent(inline, url) {
            if (inline) return Promise.resolve(inline);
            if (url) return fetch(url).then(function(r) { return r.ok ? r.text() : ''; }).catch(function() { return ''; });
            return Promise.resolve('');
          }

          var useFr = lang === 'fr' && (htmlContentFr || htmlUrlFr);
          var contentPromise = useFr
            ? resolveContent(htmlContentFr, htmlUrlFr)
            : resolveContent(htmlContent, htmlUrl);

          return contentPromise.then(function(html) { renderHtml(html, lang); });
        })
        .catch(function() {
          // REST API failed (likely 403 for a private/unpublished guide).
          // Ask the parent GuideViewer to push the HTML via postMessage — it has
          // an authenticated Firestore session that can read private guides.
          window.parent.postMessage({ type: 'REQUEST_HTML' }, '*');
          // Show an error only if neither path delivers HTML within 5 seconds.
          setTimeout(function() {
            if (!htmlRendered) statusEl.textContent = 'Error loading guide. Please try refreshing.';
          }, 5000);
        });
    }
  </script>
</body>
</html>
